<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定投看板</title>
<style>
:root{
  color-scheme: light dark;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --profit:#0ca30c; --loss:#d03b3b; --blue:#2a78d6; --blue-fill:rgba(42,120,214,.14);
  --chip:#f0efec;
}
@media (prefers-color-scheme: dark){:root{
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --profit:#0ca30c; --loss:#e05555; --blue:#3987e5; --blue-fill:rgba(57,135,229,.18);
  --chip:#26261f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:6px}
h1{font-size:20px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:13px}
.fng{margin-left:auto;font-size:13px;color:var(--ink2);background:var(--chip);
  border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.btn{font:inherit;font-size:13px;cursor:pointer;background:var(--chip);color:var(--ink2);
  border:1px solid var(--border);border-radius:999px;padding:4px 14px}
.btn:hover{color:var(--ink)} .btn:disabled{opacity:.5;cursor:default}
.updated{font-size:12px;color:var(--muted);width:100%;margin-top:2px}
section{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px 18px 16px;margin-top:16px}
h2{font-size:14px;margin:0 0 14px;font-weight:600;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.kpi .lab{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.01em}
.kpi .sub2{font-size:12px;color:var(--ink2);margin-top:3px}
.pos{color:var(--profit)} .neg{color:var(--loss)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font-size:11px} .axis line{stroke:var(--grid)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);
  font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--surface)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
th.active{color:var(--ink);font-weight:600}
td:first-child,th:first-child{text-align:left;font-variant-numeric:normal}
.tbl-wrap{overflow-x:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ava{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  font-size:8px;font-weight:700;color:#fff;margin-right:8px;vertical-align:middle;position:relative;
  overflow:hidden;flex:none;letter-spacing:-.02em}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coin-cell{display:inline-flex;align-items:center}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--plane);
  font-size:12px;padding:6px 9px;border-radius:7px;opacity:0;transition:opacity .08s;z-index:9;
  font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.legend{font-size:12px;color:var(--ink2);display:flex;gap:16px;margin-bottom:10px}
.foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
.links a{color:var(--blue);text-decoration:none;font-size:13px;margin-left:12px}
.links a:hover{text-decoration:underline}
.wallets{color:var(--muted);font-size:12px;margin:-4px 0 14px;font-variant-numeric:tabular-nums}
.wallets a{color:var(--blue);text-decoration:none}
.wallets a:hover{text-decoration:underline}
.strategy{white-space:pre-wrap;line-height:1.7;font-size:13.5px;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="pageTitle">📊 定投看板</h1>
    <span class="sub" id="sub"></span>

  <div class="kpis" id="kpis"></div>

    <div id="area"></div>
    <div class="note" id="areaNote"></div>
  </section>

  <section>
    <h2>持仓明细</h2>
    <div class="tbl-wrap"><table id="tbl"></table></div>
    <div class="note" id="tblNote"></div>

    <div class="strategy" id="strategyBody"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

// 有效数字格式：价格/均价——按量级给合理位数，去掉无意义的长尾小数
function sig(x,n=4){
  if(x==null||x===''||!isFinite(+x)) return '—';
  x=+x; if(x===0) return '0';
  const neg=x<0; x=Math.abs(x);
  let s;
  if(x>=1){ const id=Math.floor(Math.log10(x))+1; s=x.toFixed(Math.max(0,Math.min(6,n-id))); }
  else { const lead=-Math.floor(Math.log10(x))-1; s=x.toFixed(Math.min(10,lead+n)); }
  s=s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  const [i,f]=s.split('.'); const ii=(+i).toLocaleString('en-US');
  return (neg?'-':'')+(f?ii+'.'+f:ii);
}
// 数量格式：大额取整加千分位，小额给有效数字
function qty(x){
  if(x==null||!isFinite(+x)) return '—';
  x=+x; const a=Math.abs(x);
  if(a===0) return '0';
  if(a>=1000) return Math.round(x).toLocaleString('en-US');
  if(a>=1) return sig(x,4);
  return sig(x,3);
}

// 现价变动后就地重算 市值/盈亏/收益率 与总计
function recompute(){
  P.forEach(p=>{
    p.priced = p.closed || p.price>0;
    p.market_value = Math.max(p.holding,0)*p.price;
    p.pnl = p.market_value + p.sold_recovered - p.invested;
    p.roi = p.invested>0 ? p.pnl/p.invested : 0;
    p.mult = p.avg_cost>0 ? p.price/p.avg_cost : 0;
  });
  const good = P.filter(p=>p.priced && !incomplete(p));
  const unp  = P.filter(p=>!p.priced && !incomplete(p));
  t.invested = good.reduce((s,p)=>s+p.invested,0);
  t.market_value = good.reduce((s,p)=>s+p.market_value,0);
  t.recovered = good.reduce((s,p)=>s+p.sold_recovered,0);
  t.pnl = t.market_value + t.recovered - t.invested;
  t.roi = t.invested? t.pnl/t.invested : 0;
  t.held = P.filter(p=>p.holding>1e-9).length;
  t.priced_held = P.filter(p=>p.holding>1e-9 && p.price>0).length;
  t.unpriced = unp.map(p=>({coin:p.coin}));
  t.unpriced_invested = unp.reduce((s,p)=>s+p.invested,0);
}

// ---- Area: cumulative invested (静态，投入不随价变) ----
function renderArea(){
  const tl=D.timeline; const el=document.getElementById('area');
  if(!tl.length){el.innerHTML='<div class="note">暂无定投买入记录</div>';return;}
  const W=1000,H=260,P={t:14,r:16,b:26,l:52};
  const xs=tl.map(d=>+new Date(d.date)); const x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  const ymax=Math.max(...tl.map(d=>d.cum))*1.08||1;
  const X=v=>P.l+(x1===x0?0.5:(v-x0)/(x1-x0))*(W-P.l-P.r);
  const Y=v=>P.t+(1-v/ymax)*(H-P.t-P.b);
  let grid='',ticks=4;
  for(let i=0;i<=ticks;i++){const v=ymax*i/ticks,y=Y(v);
    grid+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/><text x="${P.l-8}" y="${y+4}" text-anchor="end">$${fmt(v)}</text>`;}
  const pts=tl.map(d=>[X(+new Date(d.date)),Y(d.cum)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0].toFixed(1)} ${Y(0).toFixed(1)} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[pts.length-1][0].toFixed(1)} ${Y(0).toFixed(1)} Z`;
  // x labels: first,last
  const xl=`<text x="${X(x0)}" y="${H-8}" text-anchor="start">${tl[0].date}</text><text x="${X(x1)}" y="${H-8}" text-anchor="end">${tl[tl.length-1].date}</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent" data-i="${i}"/>`).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="累计定投投入曲线">
    <g class="axis">${grid}${xl}</g>
    <path d="${area}" fill="var(--blue-fill)"/>
    <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    <g>${dots}</g></svg>`;
  el.querySelectorAll('circle').forEach(c=>{const d=tl[+c.dataset.i];
    c.addEventListener('mouseenter',e=>{c.setAttribute('fill','var(--blue)');c.setAttribute('r','4');
      showTip(e,`${d.date}<br>累计投入 $${fmt(d.cum)}`)});
    c.addEventListener('mousemove',e=>showTip(e,`${d.date}<br>累计投入 $${fmt(d.cum)}`));
    c.addEventListener('mouseleave',()=>{c.setAttribute('fill','transparent');c.setAttribute('r','9');hideTip()});});
  document.getElementById('areaNote').textContent=`共 ${tl.length} 个定投日，累计投入 $${fmt(t.invested)}。`;
}

const COLS=[

];
let sortKey='roi', sortDir=1;              // 默认收益率升序（从低到高）；dir: 1=升 -1=降
// 取排序值；无意义的（无现价/历史/未成交）返回 null，排序时永远沉底
function sortVal(r,key){
  if(key==='coin') return (r.coin||'').toLowerCase();
  const showPnl = r.priced && !incomplete(r);
  if((key==='pnl'||key==='roi'||key==='market_value') && !showPnl) return null;
  if(key==='price' && !(r.priced && r.price>0)) return null;
  if(key==='avg_cost' && !(r.avg_cost>0)) return null;
  if(key==='holding' && incomplete(r)) return null;
  const v=r[key]; return (v==null||!isFinite(v))?null:v;
}
function renderTable(){
  let h='<thead><tr>'+COLS.map(c=>{
    const active=c.key===sortKey, arrow=active?(sortDir===1?' ↑':' ↓'):'';
    return `<th data-key="${c.key}" class="sortable${active?' active':''}">${c.label}${arrow}</th>`;
  }).join('')+'</tr></thead><tbody>';
  const mut = s => `<span style="color:var(--muted)">${s}</span>`;
  const rows = P.filter(r=>r.holding>1e-9).sort((a,b)=>{   // 只列还在持有的
    const va=sortVal(a,sortKey), vb=sortVal(b,sortKey);
    if(va===null && vb===null) return 0;
    if(va===null) return 1;                // null 恒沉底，与方向无关
    if(vb===null) return -1;
    const cmp = (typeof va==='string') ? va.localeCompare(vb) : (va-vb);
    return cmp*sortDir;
  });
  rows.forEach(r=>{
    const inc=incomplete(r);
    const showPnl = r.priced && !inc;
    const pnlc = showPnl?cls(r.pnl):'';
    const hold = inc ? `<span style="color:var(--muted)" title="买入在3个月窗口外">历史</span>`
                     : (r.closed ? '0' : qty(r.holding));
    const px = r.priced ? (r.price>0?sig(r.price,3):'—') : mut('无现价');
    const coinCell = `<span class="coin-cell">${avatar(r.coin,r.logo)}${r.coin}</span>`;
    h+=`<tr><td>${coinCell}</td><td>${fmt(r.invested)}</td><td>${hold}</td>`+
       `<td>${r.avg_cost>0?sig(r.avg_cost,3):'—'}</td><td>${px}</td>`+
       `<td>${r.priced&&!inc?fmt(r.market_value):'—'}</td>`+
       `<td class="${pnlc}">${showPnl?sign(r.pnl):'—'}</td>`+
       `<td class="${pnlc}">${showPnl&&r.invested>0?pct(r.roi):'—'}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h+'</tbody>';
  document.getElementById('tblNote').textContent =
    t.unpriced.length?`其中 ${t.unpriced.length} 个币暂无现价（投入 $${fmt(t.unpriced_invested)}），未计入盈亏口径：`+t.unpriced.map(u=>u.coin).join('、'):'';
}
// 表头点击排序（委托绑定一次，重渲染不丢）
document.getElementById('tbl').addEventListener('click', e=>{
  const th=e.target.closest('th[data-key]'); if(!th) return;
  const key=th.dataset.key;
  if(key===sortKey) sortDir=-sortDir; else { sortKey=key; sortDir=(key==='coin'?1:-1); }
  renderTable();
});

// ---- 已清仓：持仓归零（卖光）的币，看已实现盈亏 ----
function renderClosed(){
  const sec=document.getElementById('closedSec');
  // 卖光=持仓≈0（含卖多于买的历史边界），且有买/卖记录
  const closed = P.filter(r=>r.holding<=1e-9 && (r.invested>0 || r.sold_recovered>0))
                  .sort((a,b)=>(b.pnl||0)-(a.pnl||0));
  if(!closed.length){ sec.style.display='none'; return; }
  sec.style.display='';
  document.getElementById('closedCount').textContent=`（${closed.length} 个）`;
  const cols=['币种','投入$','已回收$','已实现盈亏$','收益率'];
  let h='<thead><tr>'+cols.map((c,i)=>`<th${i?'':''}>${c}</th>`).join('')+'</tr></thead><tbody>';
  let totInv=0, totRec=0, totPnl=0;
  closed.forEach(r=>{
    const inc=incomplete(r);
    const realized = r.invested>0;   // 有窗口内成本才算收益率
    totInv+=r.invested; totRec+=r.sold_recovered; if(realized) totPnl+=r.pnl;
    const pnlc = realized?cls(r.pnl):'';
    h+=`<tr><td><span class="coin-cell">${avatar(r.coin,r.logo)}${r.coin}</span></td>`+
       `<td>${r.invested>0?fmt(r.invested):(inc?'<span style="color:var(--muted)" title="买入在3个月窗口外">历史</span>':'—')}</td>`+
       `<td>${r.sold_recovered>0?fmt(r.sold_recovered):'—'}</td>`+
       `<td class="${pnlc}">${realized?sign(r.pnl):'—'}</td>`+
       `<td class="${pnlc}">${realized?pct(r.roi):'—'}</td></tr>`;
  });
  document.getElementById('tblClosed').innerHTML=h+'</tbody>';
  document.getElementById('closedNote').textContent=
    `已实现：投入 $${fmt(totInv)} → 回收 $${fmt(totRec)}，合计 ${sign(totPnl)}（${totInv>0?pct(totPnl/totInv):'—'}）`;
}

const btn = document.getElementById('refreshBtn');
const updBtn = document.getElementById('updateBtn');
const upd = document.getElementById('updated');
function setUpd(s){ upd.textContent = s; }
function stamp(){ return '最后刷新 '+new Date().toLocaleTimeString('zh-CN',{hour12:false}); }
function renderAll(){ renderMeta(); renderSite(); renderFng(); renderKPIs(); renderArea(); renderTable(); renderClosed(); }

// ---- static 模式：浏览器内直接拉行情（币安全市场 + GeckoTerminal + 恐慌指数）----
async function fetchBinance(){
  const m={};
  try{
    const r=await fetch('https://api.binance.com/api/v3/ticker/price');
    if(r.ok){ (await r.json()).forEach(x=>{ if(x.symbol && x.symbol.endsWith('USDT')) m[x.symbol.slice(0,-4)]=+x.price; }); }
  }catch(e){}
  return m;
}
async function fetchGecko(need){
  const m={};
  for(const chain of Object.keys(need)){
    const ps=need[chain];
    for(let i=0;i<ps.length;i+=30){
      const chunk=ps.slice(i,i+30);
      try{
        const r=await fetch(`https://api.geckoterminal.com/api/v2/networks/${chain}/tokens/multi/${chunk.map(p=>p.addr).join(',')}`);
        if(r.ok){ ((await r.json()).data||[]).forEach(tk=>{const a=tk.attributes; if(a && a.address && a.price_usd) m[a.address.toLowerCase()]=+a.price_usd;}); }
      }catch(e){}
    }
  }
  return m;
}
async function refreshStatic(){
  btn.disabled=true; setUpd('刷新中…');
  const bmap = await fetchBinance();
  const need={};
  P.forEach(p=>{ const s=p.coin.toUpperCase(); if(!(s in bmap) && p.addr && p.chain){ (need[p.chain]=need[p.chain]||[]).push(p); }});
  const gmap = await fetchGecko(need);
  P.forEach(p=>{
    const s=p.coin.toUpperCase();
    let np = (s in bmap) ? bmap[s] : (p.addr && gmap[p.addr.toLowerCase()]!=null ? gmap[p.addr.toLowerCase()] : null);
    if(np!=null && isFinite(np) && np>0) p.price=np;
  });
  try{
    const r=await fetch('https://api.alternative.me/fng/?limit=1');
    if(r.ok){ const it=(await r.json()).data[0]; D.fng={value:+it.value, classification:it.value_classification}; }
  }catch(e){}
  recompute(); renderKPIs(); renderTable(); renderFng();
  setUpd(stamp()+' · 每 60 秒自动');
  btn.disabled=false;
}

// ---- server 模式：调本地后端接口（现价/持仓都由后端算好返回）----
async function loadServer(url, method, label){
  btn.disabled=true; if(updBtn) updBtn.disabled=true; setUpd(label||'刷新中…');
  try{
    const r = await fetch(url, {method: method||'GET'});
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    setData(d); renderAll();
    setUpd(stamp()+' · 每 60 秒自动');
  }catch(e){ setUpd('刷新失败：'+e.message); }
  btn.disabled=false; if(updBtn) updBtn.disabled=false;
}

if(MODE==='server'){
  updBtn.style.display='';
  loadServer('/api/data','GET','加载中…');
  setInterval(()=>loadServer('/api/data','GET'), 60000);
  btn.addEventListener('click', ()=>loadServer('/api/data','GET'));
  updBtn.addEventListener('click', ()=>loadServer('/api/update','POST','拉取链上中…（较慢，勿关）'));
}else{
  setData(_EMBED); renderAll();
  setUpd('数据生成于 '+D.generated+'，正在拉实时价…');
  refreshStatic();
  setInterval(refreshStatic, 60000);
  btn.addEventListener('click', refreshStatic);
}
</script>
